    <style>
        .blog-page-hero {
            padding: 120px 20px 40px;

            border-bottom: 1px solid rgba(212, 175, 55, 0.2);

        .blog-page-hero p {

            margin: 0 auto;
        }

        .blog-container {
            max-width: 1000px;
            margin: 40px auto;

        .article-card {
            background: #0e1626;

        }
        .article-card h2 {

        }
        .scripture-anchor {
            color: #d4af37;
            font-style: italic;
            font-size: 14.5px;
            margin-bottom: 14px;
            display: block;
        }
        .article-excerpt {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 18px;
        }
        .article-author-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #64748b;
            font-size: 13px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;">ALI WELEKHASIA</span>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="../" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Home</a>
            <a href="/music/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Music</a>
            <a href="/lyrics/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Lyrics</a>

            <a href="/gallery/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Gallery</a>
            <a href="/events/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Crusades</a>
            <a href="/blog/" style="color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;">Devotionals</a>
            <a href="/live" style="color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 700;"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 4px;"></i>Live</a>
        </nav>
    </header>

    <div class="blog-page-hero">
        <h1>Devotionals & Prophetic Reflections</h1>
        <p>Words of faith, worship revelation, and spiritual encouragement from Minister Ali Welekhasia.</p>
    </div>

    <div class="blog-container">
        <div id="publicBlogList">
            <p style="text-align: center; color: #64748b; padding: 40px;">Loading devotionals...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPublicBlog();
        });

        function loadPublicBlog() {
            const container = document.getElementById('publicBlogList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #94a3b8;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                    <p style="font-size: 15px; color: #fff; font-weight: 600;">Connecting to Devotional Archive...</p>
                    <p style="font-size: 13px;">Retrieving published ministry messages and devotionals from Firebase.</p>
                </div>
            `;

            if (!window.RichaliFirebase || !window.RichaliFirebase.database) {
                renderBlogError('Firebase database connection is unavailable.');
                return;
            }

            const schema = window.RichaliFirebase.schema.aliwelekhasia;
            const blogRef = window.RichaliFirebase.getDbRef(schema.blog);

            if (!blogRef) {
                renderBlogError('Database reference for devotionals could not be resolved.');
                return;
            }

            blogRef.once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (!data || Object.keys(data).length === 0) {
                        renderBlogEmpty('No devotional articles published yet.');
                    } else {
                        const published = Object.values(data).filter(p => p.status === 'PUBLISHED' || !p.status);
                        if (published.length === 0) {
                            renderBlogEmpty('No devotional articles currently published.');
                        } else {
                            renderArticles(published);
                        }
                    }
                })
                .catch((err) => {
                    console.error('Firebase Blog Read Error:', err);
                    renderBlogError(err.message || 'Permission denied or network offline.');
                });
        }

        function renderBlogEmpty(msg) {
            const container = document.getElementById('publicBlogList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: #0e1626; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
                    <i class="fa-solid fa-book-bible" style="font-size: 40px; color: #d4af37; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">No Devotionals Available</h3>
                    <p style="color: #94a3b8; font-size: 14px; max-width: 440px; margin: 0 auto;">${escapeHtml(msg)}</p>
                </div>
            `;
        }

        function renderBlogError(msg) {
            const container = document.getElementById('publicBlogList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Unable to Load Devotionals</h3>
                    <p style="color: #f87171; font-size: 14px; max-width: 480px; margin: 0 auto 20px;">${escapeHtml(msg)}</p>
                    <button onclick="loadPublicBlog()" style="background: #d4af37; color: #070b14; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right"></i> Retry Connection
                    </button>
                </div>
            `;
        }

        function renderArticles(articles) {
            const container = document.getElementById('publicBlogList');
            if (articles.length === 0) {
                renderBlogEmpty('No articles published.');
                return;
            }

            container.innerHTML = articles.map(a => `
                <article class="article-card">
                    <span class="tag-pill">${escapeHtml(a.category || 'Devotional')}</span>
                    <h2>${escapeHtml(a.title || 'Ministry Message')}</h2>
                    ${a.scripture ? `<span class="scripture-anchor"><i class="fa-solid fa-bible"></i> ${escapeHtml(a.scripture)}</span>` : ''}
                    <div class="article-excerpt" style="white-space: pre-line;">${escapeHtml(a.content || a.excerpt || '')}</div>
                    <div class="article-author-row">
                        <span>By ${escapeHtml(a.author || 'Evangelist Ali Welekhasia')}</span>
                        <span>${a.createdAt ? new Date(a.createdAt).toLocaleDateString() : (escapeHtml(a.date || 'Published'))}</span>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
