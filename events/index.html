    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Revival Crusades & Events | Ali Welekhasia Music">
    <meta property="og:description" content="Upcoming gospel crusades, revival meetings, and worship nights with Minister Ali Welekhasia.">
    <meta property="og:url" content="https://aliwelekhasia.co.ke/events/">
    <meta property="og:image" content="https://aliwelekhasia.co.ke/hero.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Revival Crusades & Events | Ali Welekhasia Music">
    <meta property="twitter:description" content="Upcoming gospel crusades, revival meetings, and worship nights with Minister Ali Welekhasia.">
    <meta property="twitter:image" content="https://aliwelekhasia.co.ke/hero.jpg">

    <!-- Schema.org JSON-LD Structured Data for Events Schedule -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EventSeries",
      "name": "Ali Welekhasia Gospel Crusades & Worship Nights",
      "description": "Live revival worship, prophetic prayer gatherings, and gospel crusades led by Evangelist Ali Welekhasia.",
      "organizer": {
        "@type": "Person",
        "name": "Ali Welekhasia",
        "url": "https://aliwelekhasia.co.ke"
      }
    }
    </script>

    <!-- Firebase SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        .events-page-hero {
            padding: 120px 20px 40px;
            background: linear-gradient(180deg, #070b14 0%, #0d1527 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .events-page-hero h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }
        .events-page-hero p {
            color: #d4af37;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .events-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .event-listing-card {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            margin-bottom: 20px;
            transition: transform 0.2s, border-color 0.2s;
        }
        .event-listing-card:hover {
            transform: translateY(-3px);
            border-color: #d4af37;
        }
        .event-date-badge {
            min-width: 90px;
            padding: 14px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            border-radius: 10px;
            text-align: center;
            color: #fbbf24;
        }
        .event-date-badge .day {
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
        }
        .event-date-badge .month {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .event-details-area {
            flex: 1;
        }
        .event-details-area h3 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 6px;
        }
        .event-meta-row {
            display: flex;
            gap: 16px;
            color: #94a3b8;
            font-size: 13.5px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .event-meta-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .event-meta-row span i {
            color: #d4af37;
        }

        @media (max-width: 650px) {
            .event-listing-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;">ALI WELEKHASIA</span>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="../" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Home</a>
            <a href="/music/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Music</a>
            <a href="/lyrics/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Lyrics</a>
            <a href="/videos/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Videos</a>
            <a href="/gallery/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Gallery</a>
            <a href="/events/" style="color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;">Crusades</a>
            <a href="/blog/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Devotionals</a>
            <a href="/live" style="color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 700;"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 4px;"></i>Live</a>
        </nav>
    </header>

    <div class="events-page-hero">
        <h1>Revival Crusades & Events</h1>
        <p>Join Minister Ali Welekhasia live in open-air crusades, worship nights, and prophetic revival conferences.</p>
    </div>

    <div class="events-container">
        <div id="publicEventsList">
            <p style="text-align: center; color: #64748b; padding: 40px;">Loading upcoming crusades...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPublicEvents();
        });

        function loadPublicEvents() {
            const container = document.getElementById('publicEventsList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #94a3b8;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                    <p style="font-size: 15px; color: #fff; font-weight: 600;">Connecting to Ministry Calendar...</p>
                    <p style="font-size: 13px;">Retrieving scheduled events and revival crusades from Firebase.</p>
                </div>
            `;

            if (!window.RichaliFirebase || !window.RichaliFirebase.database) {
                renderEventsError('Firebase database connection is unavailable.');
                return;
            }

            const schema = window.RichaliFirebase.schema.aliwelekhasia;
            const eventsRef = window.RichaliFirebase.getDbRef(schema.events);

            if (!eventsRef) {
                renderEventsError('Database reference for events could not be resolved.');
                return;
            }

            eventsRef.once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (!data || Object.keys(data).length === 0) {
                        renderEventsEmpty('No upcoming crusades or events scheduled at this time.');
                    } else {
                        const published = Object.values(data).filter(e => e.status === 'PUBLISHED' || !e.status);
                        if (published.length === 0) {
                            renderEventsEmpty('No upcoming events are currently published.');
                        } else {
                            renderEvents(published);
                        }
                    }
                })
                .catch((err) => {
                    console.error('Firebase Events Read Error:', err);
                    renderEventsError(err.message || 'Permission denied or network offline.');
                });
        }

        function renderEventsEmpty(msg) {
            const container = document.getElementById('publicEventsList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: #0e1626; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
                    <i class="fa-regular fa-calendar-xmark" style="font-size: 40px; color: #d4af37; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">No Scheduled Events</h3>
                    <p style="color: #94a3b8; font-size: 14px; max-width: 440px; margin: 0 auto;">${escapeHtml(msg)}</p>
                </div>
            `;
        }

        function renderEventsError(msg) {
            const container = document.getElementById('publicEventsList');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Unable to Load Ministry Events</h3>
                    <p style="color: #f87171; font-size: 14px; max-width: 480px; margin: 0 auto 20px;">${escapeHtml(msg)}</p>
                    <button onclick="loadPublicEvents()" style="background: #d4af37; color: #070b14; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right"></i> Retry Connection
                    </button>
                </div>
            `;
        }

        function renderEvents(events) {
            const container = document.getElementById('publicEventsList');
            if (events.length === 0) {
                renderEventsEmpty('No events found.');
                return;
            }

            container.innerHTML = events.map(e => {
                const eventDate = e.date ? new Date(e.date) : new Date();
                const day = eventDate.getDate() || '15';
                const month = eventDate.toLocaleDateString('en-US', { month: 'short' }) || 'OCT';

                return `
                    <div class="event-listing-card">
                        <div class="event-date-badge">
                            <div class="day">${day}</div>
                            <div class="month">${month}</div>
                        </div>
                        <div class="event-details-area">
                            <h3>${escapeHtml(e.title || 'Ministry Crusade')}</h3>
                            <div class="event-meta-row">
                                <span><i class="fa-regular fa-clock"></i> ${escapeHtml(e.time || 'Evening')}</span>
                                <span><i class="fa-solid fa-location-dot"></i> ${escapeHtml(e.venue || 'TBA')}, ${escapeHtml(e.location || 'Kenya')}</span>
                            </div>
                            <p style="color: #cbd5e1; font-size: 14px; line-height: 1.5;">${escapeHtml(e.description || '')}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
