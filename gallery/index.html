<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Gallery | Ali Welekhasia Music</title>
    <meta name="description" content="Crusades, revivals, and worship ministry photo gallery of Evangelist Ali Welekhasia.">
    <link rel="canonical" href="https://aliwelekhasia.co.ke/gallery/">
    <link rel="icon" type="image/jpeg" href="../hero.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ministry Gallery | Ali Welekhasia Music">
    <meta property="og:description" content="Crusades, revivals, and worship ministry photo gallery of Evangelist Ali Welekhasia.">
    <meta property="og:url" content="https://aliwelekhasia.co.ke/gallery/">
    <meta property="og:image" content="https://aliwelekhasia.co.ke/hero.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Ministry Gallery | Ali Welekhasia Music">
    <meta property="twitter:description" content="Crusades, revivals, and worship ministry photo gallery of Evangelist Ali Welekhasia.">
    <meta property="twitter:image" content="https://aliwelekhasia.co.ke/hero.jpg">

    <!-- Schema.org JSON-LD Structured Data for Gallery -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Ali Welekhasia Ministry Photo Gallery",
      "description": "Photographic archive of revival meetings, worship nights, crusades, and gospel ministrations.",
      "author": {
        "@type": "Person",
        "name": "Ali Welekhasia",
        "url": "https://aliwelekhasia.co.ke"
      }
    }
    </script>

    <!-- Firebase SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        .gallery-page-hero {
            padding: 120px 20px 40px;
            background: linear-gradient(180deg, #070b14 0%, #0d1527 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .gallery-page-hero h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }
        .gallery-page-hero p {
            color: #d4af37;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-filters-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }
        .gallery-filter-btn {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .gallery-filter-btn:hover, .gallery-filter-btn.active {
            background: #d4af37;
            color: #070b14;
            border-color: #d4af37;
        }

        .public-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-photo-card {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .gallery-photo-card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        .gallery-photo-box {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #152238;
        }
        .gallery-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .gallery-photo-card:hover .gallery-photo-box img {
            transform: scale(1.05);
        }
        .gallery-photo-details {
            padding: 16px;
        }
        .gallery-photo-details h4 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .gallery-photo-details p {
            color: #94a3b8;
            font-size: 12.5px;
            line-height: 1.4;
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;">ALI WELEKHASIA</span>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="../" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Home</a>
            <a href="/music/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Music</a>
            <a href="/lyrics/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Lyrics</a>
            <a href="/videos/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Videos</a>
            <a href="/gallery/" style="color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;">Gallery</a>
            <a href="/events/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Crusades</a>
            <a href="/blog/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Devotionals</a>
            <a href="/live" style="color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 700;"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 4px;"></i>Live</a>
        </nav>
    </header>

    <div class="gallery-page-hero">
        <h1>Ministry & Crusade Gallery</h1>
        <p>Witnessing the power of God in mass open-air crusades, worship nights, and gospel conferences.</p>
    </div>

    <div class="gallery-container">
        <!-- Filter Tabs -->
        <div class="gallery-filters-bar">
            <button class="gallery-filter-btn active" onclick="filterGallery('ALL', this)">All Photos</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Crusades', this)">Crusades & Outreaches</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Ministry', this)">Worship Nights</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Church', this)">Church Fellowship</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Studio', this)">Behind The Scenes</button>
        </div>

        <!-- Photos Grid -->
        <div id="publicGalleryGrid" class="public-gallery-grid">
            <p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Loading ministry gallery...</p>
        </div>
    </div>

    <script>
        let allGalleryItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadPublicGallery();
        });

        function loadPublicGallery() {
            const container = document.getElementById('publicGalleryGrid');
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                    <p style="font-size: 15px; color: #fff; font-weight: 600;">Connecting to Ministry Gallery...</p>
                    <p style="font-size: 13px;">Retrieving published photo records from Firebase.</p>
                </div>
            `;

            if (!window.RichaliFirebase || !window.RichaliFirebase.database) {
                renderGalleryError('Firebase database connection is unavailable.');
                return;
            }

            const schema = window.RichaliFirebase.schema.aliwelekhasia;
            const galleryRef = window.RichaliFirebase.getDbRef(schema.gallery);

            if (!galleryRef) {
                renderGalleryError('Database reference for gallery could not be resolved.');
                return;
            }

            galleryRef.once('value')
                .then((snap) => {
                    const data = snap.val();
                    if (!data || Object.keys(data).length === 0) {
                        allGalleryItems = [];
                        renderGalleryEmpty('No photos published in the ministry gallery yet.');
                    } else {
                        allGalleryItems = Object.values(data).filter(item => item.status === 'PUBLISHED' || !item.status);
                        if (allGalleryItems.length === 0) {
                            renderGalleryEmpty('No published photos available in the gallery.');
                        } else {
                            renderGalleryItems(allGalleryItems);
                        }
                    }
                })
                .catch((err) => {
                    console.error('Firebase Gallery Read Error:', err);
                    renderGalleryError(err.message || 'Permission denied or network offline.');
                });
        }

        function renderGalleryEmpty(msg) {
            const container = document.getElementById('publicGalleryGrid');
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: #0e1626; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
                    <i class="fa-solid fa-images" style="font-size: 40px; color: #d4af37; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Gallery is Empty</h3>
                    <p style="color: #94a3b8; font-size: 14px; max-width: 440px; margin: 0 auto;">${escapeHtml(msg)}</p>
                </div>
            `;
        }

        function renderGalleryError(msg) {
            const container = document.getElementById('publicGalleryGrid');
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px;">
                    <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Unable to Load Ministry Gallery</h3>
                    <p style="color: #f87171; font-size: 14px; max-width: 480px; margin: 0 auto 20px;">${escapeHtml(msg)}</p>
                    <button onclick="loadPublicGallery()" style="background: #d4af37; color: #070b14; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right"></i> Retry Connection
                    </button>
                </div>
            `;
        }

        function renderGalleryItems(items) {
            const container = document.getElementById('publicGalleryGrid');
            if (items.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">
                        <i class="fa-solid fa-filter" style="font-size: 28px; color: #64748b; margin-bottom: 10px; display: block;"></i>
                        <p style="font-size: 14px;">No photos available in this selected category.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="gallery-photo-card">
                    <div class="gallery-photo-box">
                        <img src="${item.imageUrl || '../images/hero.jpg'}" alt="${escapeHtml(item.title || 'Photo')}" loading="lazy" onerror="this.src='../images/hero.jpg'">
                    </div>
                    <div class="gallery-photo-details">
                        <h4>${escapeHtml(item.title || 'Ministry Photo')}</h4>
                        <p>${escapeHtml(item.caption || '')}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterGallery(category, btnElem) {
            document.querySelectorAll('.gallery-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElem) btnElem.classList.add('active');

            if (category === 'ALL') {
                renderGalleryItems(allGalleryItems);
            } else {
                const filtered = allGalleryItems.filter(item => (item.category || '').toLowerCase() === category.toLowerCase());
                renderGalleryItems(filtered);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
