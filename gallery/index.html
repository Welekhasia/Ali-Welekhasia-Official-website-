<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Gallery | Ali Welekhasia Music</title>
    <meta name="description" content="Crusades, revivals, and worship ministry photo gallery of Evangelist Ali Welekhasia.">
    <link rel="icon" type="image/jpeg" href="../hero.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../style.css">

    <!-- Firebase SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        .gallery-page-hero {
            padding: 120px 20px 40px;
            background: linear-gradient(180deg, #070b14 0%, #0d1527 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .gallery-page-hero h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }
        .gallery-page-hero p {
            color: #d4af37;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-filters-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }
        .gallery-filter-btn {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: #94a3b8;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .gallery-filter-btn:hover, .gallery-filter-btn.active {
            background: #d4af37;
            color: #070b14;
            border-color: #d4af37;
        }

        .public-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .gallery-photo-card {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }
        .gallery-photo-card:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }
        .gallery-photo-box {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #152238;
        }
        .gallery-photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .gallery-photo-card:hover .gallery-photo-box img {
            transform: scale(1.05);
        }
        .gallery-photo-details {
            padding: 16px;
        }
        .gallery-photo-details h4 {
            color: #fff;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .gallery-photo-details p {
            color: #94a3b8;
            font-size: 12.5px;
            line-height: 1.4;
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;">ALI WELEKHASIA</span>
        </a>
        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="../" style="color: #94a3b8; text-decoration: none; font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> Home</a>
            <a href="../lyrics" style="color: #94a3b8; text-decoration: none; font-size: 14px;">Lyrics</a>
            <a href="../live" style="color: #ef4444; text-decoration: none; font-size: 14px;"><i class="fa-solid fa-tower-broadcast"></i> Live Stream</a>
            <a href="../admin" style="background: rgba(212, 175, 55, 0.15); border: 1px solid #d4af37; color: #d4af37; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600;"><i class="fa-solid fa-lock"></i> Admin CMS</a>
        </div>
    </header>

    <div class="gallery-page-hero">
        <h1>Ministry & Crusade Gallery</h1>
        <p>Witnessing the power of God in mass open-air crusades, worship nights, and gospel conferences.</p>
    </div>

    <div class="gallery-container">
        <!-- Filter Tabs -->
        <div class="gallery-filters-bar">
            <button class="gallery-filter-btn active" onclick="filterGallery('ALL', this)">All Photos</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Crusades', this)">Crusades & Outreaches</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Ministry', this)">Worship Nights</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Church', this)">Church Fellowship</button>
            <button class="gallery-filter-btn" onclick="filterGallery('Studio', this)">Behind The Scenes</button>
        </div>

        <!-- Photos Grid -->
        <div id="publicGalleryGrid" class="public-gallery-grid">
            <p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Loading ministry gallery...</p>
        </div>
    </div>

    <script>
        let allGalleryItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadPublicGallery();
        });

        function loadPublicGallery() {
            if (window.RichaliFirebase && window.RichaliFirebase.database) {
                const schema = window.RichaliFirebase.schema.aliwelekhasia;
                window.RichaliFirebase.getDbRef(schema.gallery).once('value', (snap) => {
                    const data = snap.val() || {};
                    allGalleryItems = Object.values(data).filter(item => item.status === 'PUBLISHED' || !item.status);
                    renderGalleryItems(allGalleryItems);
                });
            } else {
                renderDefaultGalleryFallback();
            }
        }

        function renderDefaultGalleryFallback() {
            allGalleryItems = [
                { title: "Mombasa Revival Crusade", category: "Crusades", caption: "Thousands gathering for open-air worship and prophetic impartation.", imageUrl: "../images/hero.jpg" },
                { title: "Nairobi Worship Night", category: "Ministry", caption: "Anointed praise atmosphere lifting the name of Jesus Christ.", imageUrl: "../images/hero.jpg" },
                { title: "Eldoret Gospel Outreach", category: "Crusades", caption: "Souls won into the Kingdom of God.", imageUrl: "../images/hero.jpg" }
            ];
            renderGalleryItems(allGalleryItems);
        }

        function renderGalleryItems(items) {
            const container = document.getElementById('publicGalleryGrid');
            if (items.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 40px;">No photos available in this category.</p>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="gallery-photo-card">
                    <div class="gallery-photo-box">
                        <img src="${item.imageUrl || '../images/hero.jpg'}" alt="${item.title || 'Photo'}" loading="lazy" onerror="this.src='../images/hero.jpg'">
                    </div>
                    <div class="gallery-photo-details">
                        <h4>${item.title || 'Ministry Photo'}</h4>
                        <p>${item.caption || ''}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterGallery(category, btnElem) {
            document.querySelectorAll('.gallery-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElem) btnElem.classList.add('active');

            if (category === 'ALL') {
                renderGalleryItems(allGalleryItems);
            } else {
                const filtered = allGalleryItems.filter(item => (item.category || '').toLowerCase() === category.toLowerCase());
                renderGalleryItems(filtered);
            }
        }
    </script>
</body>
</html>
