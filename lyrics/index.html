<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gospel Song Lyrics | Ali Welekhasia Music</title>
    <meta name="description" content="Official gospel song lyrics, verses, and choruses by Minister Ali Welekhasia. Anointed Swahili & Luhya worship.">
    <link rel="canonical" href="https://aliwelekhasia.co.ke/lyrics/">
    <link rel="icon" type="image/jpeg" href="../hero.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="music.song">
    <meta property="og:title" content="Gospel Song Lyrics | Ali Welekhasia Music">
    <meta property="og:description" content="Official gospel song lyrics, verses, and choruses by Minister Ali Welekhasia. Anointed Swahili & Luhya worship.">
    <meta property="og:url" content="https://aliwelekhasia.co.ke/lyrics/">
    <meta property="og:image" content="https://aliwelekhasia.co.ke/hero.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Gospel Song Lyrics | Ali Welekhasia Music">
    <meta property="twitter:description" content="Official gospel song lyrics, verses, and choruses by Minister Ali Welekhasia.">
    <meta property="twitter:image" content="https://aliwelekhasia.co.ke/hero.jpg">

    <!-- Schema.org JSON-LD Structured Data for Lyrics -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicComposition",
      "name": "Ali Welekhasia Gospel Song Lyrics Archive",
      "composer": {
        "@type": "Person",
        "name": "Ali Welekhasia",
        "url": "https://aliwelekhasia.co.ke"
      },
      "inLanguage": ["sw", "luh", "en"],
      "description": "Full lyrics, verses, choruses, and spiritual chords for gospel worship songs by Ali Welekhasia."
    }
    </script>

    <!-- Firebase SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        .public-page-header {
            padding: 120px 20px 40px;
            background: linear-gradient(180deg, #070b14 0%, #0d1527 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .public-page-header h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }
        .public-page-header p {
            color: #d4af37;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .lyrics-directory-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        .song-selector-sidebar {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }
        .song-selector-sidebar h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .lyrics-song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
        }
        .lyrics-song-item:hover, .lyrics-song-item.active {
            background: rgba(212, 175, 55, 0.15);
            color: #fbbf24;
            border-left: 3px solid #d4af37;
        }
        .lyrics-song-item img {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
        }

        .lyrics-view-panel {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 36px;
        }
        .lyrics-header-box {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .lyrics-header-thumb {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #d4af37;
        }
        .lyrics-header-info h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 4px;
            font-family: 'Cinzel', serif;
        }
        .lyrics-header-info .artist-name {
            color: #d4af37;
            font-size: 16px;
            font-weight: 600;
        }
        .lyrics-meta-pill {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
            display: inline-block;
        }

        .lyrics-section-block {
            margin-bottom: 30px;
        }
        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-lines {
            font-size: 16px;
            line-height: 1.9;
            color: #f1f5f9;
            white-space: pre-line;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .btn-copy-lyrics {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-copy-lyrics:hover {
            background: #d4af37;
            color: #070b14;
        }

        @media (max-width: 860px) {
            .lyrics-directory-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700; letter-spacing: 0.5px;">ALI WELEKHASIA</span>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="../" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Home</a>
            <a href="/music/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Music</a>
            <a href="/lyrics/" style="color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;">Lyrics</a>
            <a href="/videos/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Videos</a>
            <a href="/gallery/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Gallery</a>
            <a href="/events/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Crusades</a>
            <a href="/blog/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Devotionals</a>
            <a href="/live" style="color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 700;"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 4px;"></i>Live</a>
        </nav>
    </header>

    <div class="public-page-header">
        <h1>Gospel Song Lyrics</h1>
        <p>Anointed worship melodies, prayer confessions, and praise lyrics to glorify Jesus Christ.</p>
    </div>

    <!-- Feedback Toast -->
    <div id="lyricsToast" style="position: fixed; bottom: 30px; right: 30px; background: #d4af37; color: #070b14; padding: 12px 24px; border-radius: 8px; font-weight: 600; display: none; z-index: 1000; box-shadow: 0 8px 20px rgba(0,0,0,0.5);"></div>

    <div class="lyrics-directory-container" id="lyricsMainContainer">
        <!-- Sidebar: Song List -->
        <aside class="song-selector-sidebar">
            <h3><i class="fa-solid fa-music" style="color: #d4af37;"></i> Songs Catalogue</h3>
            <div id="lyricsSongList">
                <p style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> Connecting to catalogue...</p>
            </div>
        </aside>

        <!-- Main View: Lyrics Display -->
        <main class="lyrics-view-panel">
            <div id="lyricsContentArea">
                <!-- Header with cover, title, artist, audio player, copy button -->
                <div class="lyrics-header-box" id="lyricsHeaderBox" style="display: none;">
                    <img id="activeSongArtwork" src="../images/hero.jpg" class="lyrics-header-thumb" alt="Song Artwork" onerror="this.src='../images/hero.jpg'">
                    <div class="lyrics-header-info" style="flex: 1;">
                        <h2 id="activeSongTitle">—</h2>
                        <div class="artist-name" id="activeSongArtist">—</div>
                        <div class="lyrics-meta-pill" id="activeSongMeta">—</div>
                    </div>
                    <div>
                        <button class="btn-copy-lyrics" onclick="copyActiveSongLyrics()">
                            <i class="fa-regular fa-copy"></i> Copy Lyrics
                        </button>
                    </div>
                </div>

                <!-- Audio player if present -->
                <div id="audioPlayerContainer" style="display: none; margin-bottom: 24px;">
                    <audio id="publicAudioPlayer" controls style="width: 100%; border-radius: 8px;"></audio>
                </div>

                <!-- Lyrics Sections -->
                <div id="lyricsRenderedSections">
                    <div style="text-align: center; padding: 60px 20px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                        <p>Loading lyrics from Firebase...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const PublicLyrics = {
            songs: {},
            lyrics: {},
            activeSongId: null
        };

        document.addEventListener('DOMContentLoaded', () => {
            initPublicLyrics();
        });

        function initPublicLyrics() {
            const params = new URLSearchParams(window.location.search);
            const querySong = params.get('song');

            const listContainer = document.getElementById('lyricsSongList');
            const sectionsContainer = document.getElementById('lyricsRenderedSections');

            if (!window.RichaliFirebase || !window.RichaliFirebase.database) {
                renderLyricsError('Firebase Realtime Database is not active.');
                return;
            }

            const schema = window.RichaliFirebase.schema.aliwelekhasia;
            const songsRef = window.RichaliFirebase.getDbRef(schema.songs);

            if (!songsRef) {
                renderLyricsError('Database reference for songs is unavailable.');
                return;
            }

            // Fetch Songs from live database
            songsRef.once('value', (snap) => {
                const data = snap.val();
                if (!data || Object.keys(data).length === 0) {
                    PublicLyrics.songs = {};
                    renderLyricsEmpty('No songs available in the database catalogue.');
                    return;
                }

                PublicLyrics.songs = data;

                // Fetch Lyrics from live database
                const lyricsRef = window.RichaliFirebase.getDbRef(schema.lyrics);
                if (lyricsRef) {
                    lyricsRef.once('value', (lyricsSnap) => {
                        PublicLyrics.lyrics = lyricsSnap.val() || {};
                        renderSongSelectorList(querySong);
                    }, (err) => {
                        console.warn('[Lyrics fetch error]:', err);
                        PublicLyrics.lyrics = {};
                        renderSongSelectorList(querySong);
                    });
                } else {
                    renderSongSelectorList(querySong);
                }
            }, (error) => {
                console.error('[Songs fetch error]:', error);
                renderLyricsError(error.message || 'Permission denied or offline.');
            });
        }

        function renderLyricsEmpty(msg) {
            const listContainer = document.getElementById('lyricsSongList');
            const sectionsContainer = document.getElementById('lyricsRenderedSections');
            const headerBox = document.getElementById('lyricsHeaderBox');
            if (headerBox) headerBox.style.display = 'none';

            if (listContainer) {
                listContainer.innerHTML = `<p style="color: #64748b; font-size: 13px; text-align: center; padding: 20px;">${escapeHtml(msg)}</p>`;
            }
            if (sectionsContainer) {
                sectionsContainer.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #94a3b8;">
                        <i class="fa-solid fa-file-lines" style="font-size: 40px; color: #d4af37; margin-bottom: 16px; display: block;"></i>
                        <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">No Lyrics Found</h3>
                        <p style="max-width: 440px; margin: 0 auto 16px; font-size: 14px; line-height: 1.5;">${escapeHtml(msg)}</p>
                        <button onclick="initPublicLyrics()" style="background: #d4af37; color: #070b14; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                            <i class="fa-solid fa-rotate-right"></i> Refresh
                        </button>
                    </div>
                `;
            }
        }

        function renderLyricsError(msg) {
            const listContainer = document.getElementById('lyricsSongList');
            const sectionsContainer = document.getElementById('lyricsRenderedSections');
            const headerBox = document.getElementById('lyricsHeaderBox');
            if (headerBox) headerBox.style.display = 'none';

            if (listContainer) {
                listContainer.innerHTML = `<p style="color: #ef4444; font-size: 13px; text-align: center; padding: 20px;">Unable to load songs.</p>`;
            }
            if (sectionsContainer) {
                sectionsContainer.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; color: #94a3b8; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; background: rgba(239, 68, 68, 0.05);">
                        <i class="fa-solid fa-circle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 16px; display: block;"></i>
                        <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Database Offline / Unavailable</h3>
                        <p style="max-width: 480px; margin: 0 auto 16px; font-size: 14px; line-height: 1.5;">${escapeHtml(msg)}</p>
                        <button onclick="initPublicLyrics()" style="background: #d4af37; color: #070b14; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                            <i class="fa-solid fa-rotate-right"></i> Retry Connection
                        </button>
                    </div>
                `;
            }
        }

        function renderSongSelectorList(selectedSongId) {
            const listContainer = document.getElementById('lyricsSongList');
            const songs = Object.values(PublicLyrics.songs).filter(s => s.status === 'PUBLISHED' || !s.status);

            if (songs.length === 0) {
                renderLyricsEmpty('No published songs found in the catalogue.');
                return;
            }

            listContainer.innerHTML = songs.map(s => `
                <div class="lyrics-song-item ${selectedSongId === s.id ? 'active' : ''}" onclick="selectSong('${s.id}')" data-song-id="${s.id}">
                    <img src="${s.artworkUrl || '../images/hero.jpg'}" alt="${escapeHtml(s.title)}" onerror="this.src='../images/hero.jpg'">
                    <div>
                        <div style="font-weight: 600; color: #fff; font-size: 14px;">${escapeHtml(s.title)}</div>
                        <div style="font-size: 11.5px; color: #94a3b8;">${escapeHtml(s.genre || 'Gospel')}</div>
                    </div>
                </div>
            `).join('');

            // Select matching or first song
            const targetId = selectedSongId && PublicLyrics.songs[selectedSongId] 
                ? selectedSongId 
                : songs[0].id;
            selectSong(targetId);
        }

        function selectSong(songId) {
            PublicLyrics.activeSongId = songId;
            const song = PublicLyrics.songs[songId];
            if (!song) return;

            // Highlight sidebar item
            document.querySelectorAll('.lyrics-song-item').forEach(item => {
                if (item.getAttribute('data-song-id') === songId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            const headerBox = document.getElementById('lyricsHeaderBox');
            if (headerBox) headerBox.style.display = 'flex';

            document.getElementById('activeSongTitle').innerText = song.title;
            document.getElementById('activeSongArtist').innerText = song.artist || 'Ali Welekhasia';
            document.getElementById('activeSongMeta').innerText = `${song.genre || 'Worship'} • ${song.album || 'Single'}`;
            if (song.artworkUrl) document.getElementById('activeSongArtwork').src = song.artworkUrl;

            // Audio Player
            const playerBox = document.getElementById('audioPlayerContainer');
            const player = document.getElementById('publicAudioPlayer');
            if (song.audioUrl) {
                player.src = song.audioUrl;
                playerBox.style.display = 'block';
            } else {
                playerBox.style.display = 'none';
            }

            // Render lyrics sections
            const lyricsData = PublicLyrics.lyrics[songId];
            const sectionsContainer = document.getElementById('lyricsRenderedSections');

            if (lyricsData && lyricsData.sections && Array.isArray(lyricsData.sections) && lyricsData.sections.length > 0) {
                sectionsContainer.innerHTML = lyricsData.sections.map(sec => `
                    <div class="lyrics-section-block">
                        <div class="section-label"><i class="fa-solid fa-bookmark"></i> ${escapeHtml(sec.title || sec.type || 'SECTION')}</div>
                        <div class="section-lines">${escapeHtml(sec.text || '')}</div>
                    </div>
                `).join('');
            } else {
                sectionsContainer.innerHTML = `
                    <div style="text-align: center; padding: 50px 20px; color: #94a3b8; background: #0e1626; border-radius: 10px; border: 1px dashed rgba(212, 175, 55, 0.2);">
                        <i class="fa-solid fa-music" style="font-size: 32px; color: #d4af37; margin-bottom: 12px; display: block;"></i>
                        <h4 style="color: #fff; font-size: 16px; margin-bottom: 6px;">Lyrics Not Published Yet</h4>
                        <p style="font-size: 13.5px; line-height: 1.5; max-width: 420px; margin: 0 auto 12px;">
                            The official lyrics and chord progression for "<strong>${escapeHtml(song.title)}</strong>" have not been uploaded to the database yet.
                        </p>
                        <a href="../#prayer" style="color: #d4af37; text-decoration: none; font-size: 13px; font-weight: 500;">
                            <i class="fa-solid fa-hands-praying"></i> Submit a request or prayer note
                        </a>
                    </div>
                `;
            }
        }

        function copyActiveSongLyrics() {
            const title = document.getElementById('activeSongTitle').innerText;
            const lines = document.getElementById('lyricsRenderedSections').innerText;
            if (!lines || lines.includes('Lyrics Not Published Yet')) {
                showLyricsToast('No lyrics available to copy.', '#ef4444');
                return;
            }

            const full = `${title} - Ali Welekhasia\n\n${lines}\n\n© Ali Welekhasia Gospel Music Ministry (aliwelekhasia.co.ke)`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(full).then(() => {
                    showLyricsToast('Lyrics copied to clipboard successfully!', '#10b981');
                }).catch(() => {
                    showLyricsToast('Copied lyrics to clipboard.', '#d4af37');
                });
            } else {
                showLyricsToast('Lyrics ready to copy.', '#d4af37');
            }
        }

        function showLyricsToast(msg, bg) {
            const toast = document.getElementById('lyricsToast');
            if (!toast) return;
            toast.innerText = msg;
            toast.style.background = bg || '#d4af37';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
