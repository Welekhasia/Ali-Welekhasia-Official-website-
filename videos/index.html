<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

    <!-- Open Graph / Social SEO -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Gospel Videos & Ministrations | Ali Welekhasia Music">
    <meta property="og:description" content="Watch official gospel music videos, worship broadcasts, and prophetic crusades by Minister Ali Welekhasia.">
    <meta property="og:url" content="https://aliwelekhasia.co.ke/videos/">
    <meta property="og:image" content="https://aliwelekhasia.co.ke/hero.jpg">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Gospel Videos & Ministrations | Ali Welekhasia Music">
    <meta property="twitter:description" content="Watch official gospel music videos, worship broadcasts, and prophetic crusades by Minister Ali Welekhasia.">
    <meta property="twitter:image" content="https://aliwelekhasia.co.ke/hero.jpg">

    <!-- Schema.org JSON-LD Structured Data for Videos -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Ali Welekhasia Official Gospel Videos & Ministrations",
      "description": "Archive of gospel music videos, live praise sessions, and crusade video ministrations.",
      "author": {
        "@type": "Person",
        "name": "Ali Welekhasia",
        "url": "https://aliwelekhasia.co.ke"
      }
    }
    </script>

    <!-- Firebase SDK v10 Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        .videos-page-hero {
            padding: 120px 20px 40px;
            background: linear-gradient(180deg, #070b14 0%, #0d1527 100%);
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .videos-page-hero h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cinzel', serif;
        }
        .videos-page-hero p {
            color: #d4af37;
            font-size: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .videos-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .public-videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 26px;
        }

        .video-card-item {
            background: #0e1626;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.25s, border-color 0.25s;
        }
        .video-card-item:hover {
            transform: translateY(-4px);
            border-color: #d4af37;
        }
        .video-thumb-container {
            width: 100%;
            height: 200px;
            position: relative;
            background: #000;
        }
        .video-thumb-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: background 0.2s;
        }
        .video-play-overlay:hover {
            background: rgba(0, 0, 0, 0.2);
        }
        .video-play-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #d4af37;
            color: #070b14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            padding-left: 4px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .video-info-box {
            padding: 18px;
        }
        .video-info-box h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .video-info-box p {
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body style="background-color: #070b14; color: #fff;">

    <!-- Navigation Header -->
    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(7, 11, 20, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 15px 24px; display: flex; align-items: center; justify-content: space-between;">
        <a href="../" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff;">
            <div style="width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, #d4af37, #b89628); display: flex; align-items: center; justify-content: center; color: #070b14; font-size: 18px; font-weight: bold;"><i class="fa-solid fa-crown"></i></div>
            <span style="font-family: 'Cinzel', serif; font-size: 17px; font-weight: 700;">ALI WELEKHASIA</span>
        </a>
        <nav style="display: flex; gap: 20px; align-items: center;">
            <a href="../" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Home</a>
            <a href="/music/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Music</a>
            <a href="/lyrics/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Lyrics</a>
            <a href="/videos/" style="color: #d4af37; text-decoration: none; font-size: 14px; font-weight: 600;">Videos</a>
            <a href="/gallery/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Gallery</a>
            <a href="/events/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Crusades</a>
            <a href="/blog/" style="color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500;">Devotionals</a>
            <a href="/live" style="color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 700;"><i class="fa-solid fa-circle" style="font-size: 8px; margin-right: 4px;"></i>Live</a>
        </nav>
    </header>

    <div class="videos-page-hero">
        <h1>Gospel Videos & Ministrations</h1>
        <p>Experience anointed gospel worship visuals, studio recordings, and crusade video archives.</p>
    </div>

    <div class="videos-container">
        <div id="publicVideosGrid" class="public-videos-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                <p>Loading video catalogue from Firebase...</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPublicVideos();
        });

        function loadPublicVideos() {
            const container = document.getElementById('publicVideosGrid');
            if (!container) return;

            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 32px; color: #d4af37; margin-bottom: 16px;"></i>
                    <p>Connecting to video database...</p>
                </div>
            `;

            if (!window.RichaliFirebase || !window.RichaliFirebase.database) {
                renderVideosError('Firebase Realtime Database is not active.');
                return;
            }

            const schema = window.RichaliFirebase.schema.aliwelekhasia;
            const ref = window.RichaliFirebase.getDbRef(schema.videos);
            if (!ref) {
                renderVideosError('Video database reference unavailable.');
                return;
            }

            ref.once('value', (snap) => {
                const data = snap.val();
                if (!data || Object.keys(data).length === 0) {
                    renderVideosEmpty();
                    return;
                }

                const published = Object.values(data).filter(v => v.status === 'PUBLISHED' || !v.status);
                if (published.length === 0) {
                    renderVideosEmpty();
                } else {
                    renderVideos(published);
                }
            }, (error) => {
                console.error('[Public Videos Error]:', error);
                renderVideosError(error.message || 'Permission denied or offline.');
            });
        }

        function renderVideosEmpty() {
            const container = document.getElementById('publicVideosGrid');
            if (!container) return;
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8; background: #0e1626; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.2);">
                    <i class="fa-solid fa-video" style="font-size: 40px; color: #d4af37; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">No Videos Published Yet</h3>
                    <p style="max-width: 440px; margin: 0 auto 16px; font-size: 14px; line-height: 1.5;">
                        Official ministrations and videos will appear here once published from the CMS.
                    </p>
                    <button onclick="loadPublicVideos()" style="background: #d4af37; color: #070b14; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right"></i> Refresh
                    </button>
                </div>
            `;
        }

        function renderVideosError(msg) {
            const container = document.getElementById('publicVideosGrid');
            if (!container) return;
            container.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #94a3b8; background: rgba(239, 68, 68, 0.05); border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.4);">
                    <i class="fa-solid fa-circle-exclamation" style="font-size: 40px; color: #ef4444; margin-bottom: 16px; display: block;"></i>
                    <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">Database Offline / Unavailable</h3>
                    <p style="max-width: 480px; margin: 0 auto 16px; font-size: 14px; line-height: 1.5;">${escapeHtml(msg)}</p>
                    <button onclick="loadPublicVideos()" style="background: #d4af37; color: #070b14; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-rotate-right"></i> Retry Connection
                    </button>
                </div>
            `;
        }

        function renderVideos(videos) {
            const container = document.getElementById('publicVideosGrid');
            if (!container) return;

            container.innerHTML = videos.map(v => `
                <div class="video-card-item">
                    <div class="video-thumb-container">
                        <img src="${v.thumbnailUrl || (v.youtubeId ? `https://img.youtube.com/vi/${v.youtubeId}/hqdefault.jpg` : '../images/hero.jpg')}" alt="${escapeHtml(v.title)}" onerror="this.src='../images/hero.jpg'">
                        <a href="${v.youtubeUrl || '#'}" target="_blank" rel="noopener noreferrer" class="video-play-overlay">
                            <div class="video-play-btn"><i class="fa-solid fa-play"></i></div>
                        </a>
                    </div>
                    <div class="video-info-box">
                        <h3>${escapeHtml(v.title)}</h3>
                        <p>${escapeHtml(v.description || '')}</p>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
